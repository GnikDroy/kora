<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kora Playground</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Shantell+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              white: "#fefaeb",
              zinc: {
                50: "#f9f5d7", 100: "#f2e5bc", 200: "#ebdbb2", 300: "#d5c4a1",
                400: "#bdae93", 500: "#928374", 600: "#7c6f64", 700: "#504945",
                800: "#3c3836", 900: "#282828", 950: "#1d2021",
              },
              emerald: { 500: "#427b58", 600: "#2f5a40" },
            },
          },
        },
      };
      if (localStorage.getItem("kora-theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link
      rel="stylesheet"
      data-name="vs/editor/editor.main"
      href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.20.0/min/vs/editor/editor.main.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.26.1/min/vs/loader.min.js"></script>

    <link rel="stylesheet" href="playground/style.css" />
    <script>
      require.config({
        paths: {
          vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.26.1/min/vs",
        },
      });
    </script>
    <script type="module" src="playground/main.js"></script>
  </head>
  <body class="bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 overflow-hidden">
    <main class="flex flex-row h-screen">
      <!-- Editor -->
      <section class="w-1/2 h-full border-r border-zinc-200 dark:border-zinc-800 flex flex-col">
        <div class="h-9 flex items-center gap-2 px-2 border-b border-zinc-200 dark:border-zinc-800">
          <img src="logo.svg" alt="Kora" width="24" height="24" class="w-6 h-6 flex-none" />
          <span class="font-brand text-2xl leading-none text-zinc-800 dark:text-zinc-100 flex-none">Kora</span>
          <div id="file-picker" class="relative ml-auto">
            <button
              id="file-picker-btn"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              class="file-picker-btn"
            >
              <span id="file-picker-label">…</span>
              <i class="fa-solid fa-chevron-down fp-caret"></i>
            </button>
            <ul
              id="file-picker-menu"
              role="listbox"
              aria-label="Example programs"
              class="file-picker-menu hidden"
            ></ul>
          </div>
          <button
            id="reset-btn"
            title="Restore this file's original example"
            class="flex-none px-2.5 py-1 rounded-md text-xs text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200 hover:bg-zinc-200/60 dark:hover:bg-zinc-800/60 transition-colors"
          >
            <i class="fa-solid fa-rotate-left text-[10px] mr-1"></i>
            Reset
          </button>
        </div>
        <div id="editor" class="w-full flex-1 min-h-0"></div>
      </section>

      <!-- Right pane: tabs + input -->
      <section class="w-1/2 h-full flex flex-col">
        <!-- Tabs -->
        <div class="h-9 flex items-center border-b border-zinc-200 dark:border-zinc-800 pr-2">
          <button
            class="tab-btn active px-4 h-full text-xs uppercase tracking-wider text-zinc-500 border-b-2 border-transparent hover:text-zinc-700 dark:hover:text-zinc-300 transition-colors"
            data-tab="output"
          >
            Output
          </button>
          <button
            class="tab-btn px-4 h-full text-xs uppercase tracking-wider text-zinc-500 border-b-2 border-transparent hover:text-zinc-700 dark:hover:text-zinc-300 transition-colors"
            data-tab="canvas"
          >
            Canvas
          </button>
          <button
            class="tab-btn px-4 h-full text-xs uppercase tracking-wider text-zinc-500 border-b-2 border-transparent hover:text-zinc-700 dark:hover:text-zinc-300 transition-colors"
            data-tab="js"
          >
            JS
          </button>
          <div class="ml-auto flex items-center gap-2">
            <button
              id="theme-btn"
              aria-label="Toggle dark mode"
              class="w-7 h-7 rounded-md text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200 transition-colors"
            >
              <i class="fa-solid fa-moon"></i>
            </button>
            <button
              id="run-btn"
              disabled
              class="inline-flex items-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-sm px-3.5 py-1 rounded-md transition-colors disabled:hover:bg-emerald-500 opacity-50 cursor-not-allowed"
            >
              <i class="fa-solid fa-play text-xs"></i>
              <span class="run-label">Loading…</span>
            </button>
          </div>
        </div>

        <!-- Tab panels -->
        <div class="flex-1 min-h-0 relative">
          <div
            class="tab-panel absolute inset-0 overflow-auto p-4"
            data-tab="output"
          >
            <pre id="stdout" class="whitespace-pre text-zinc-800 dark:text-zinc-200"></pre>
          </div>
          <div
            class="tab-panel absolute inset-0 hidden"
            data-tab="js"
          >
            <div id="js-view" class="w-full h-full"></div>
          </div>
          <div
            class="tab-panel absolute inset-0 hidden"
            data-tab="canvas"
          >
            <div class="w-full h-full overflow-auto p-4 flex items-center justify-center">
              <canvas
                id="canvas"
                width="640"
                height="480"
                class="max-w-full max-h-full border border-zinc-200 dark:border-zinc-800 bg-zinc-900"
              ></canvas>
            </div>
          </div>
        </div>

        <!-- stdin -->
        <div class="border-t border-zinc-200 dark:border-zinc-800 px-4 py-3">
          <label
            for="stdin"
            class="block text-xs uppercase tracking-wider text-zinc-500 mb-1"
          >
            Standard input
          </label>
          <input
            id="stdin"
            type="text"
            class="block w-full rounded-md bg-white border border-zinc-300 dark:bg-zinc-800 dark:border-zinc-700 focus:border-emerald-500 focus:ring-0 py-1.5 px-3 text-sm text-zinc-900 dark:text-zinc-100 placeholder:text-zinc-400 dark:placeholder:text-zinc-500 outline-none transition-colors"
            placeholder="Whatever your program reads via input()"
          />
        </div>
      </section>
    </main>
  </body>
</html>
