name: Native backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install LLVM 22 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install LLVM 22 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --features codegen

  windows:
    name: windows-latest (best effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: llvm
          init-shell: powershell
          create-args: >-
            llvmdev=22
            clang=22
      - name: Test
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Git\usr\bin*' }) -join ';'
          $env:LLVM_SYS_221_PREFIX = "$env:MAMBA_ROOT_PREFIX\envs\llvm\Library"
          $lib = "$env:LLVM_SYS_221_PREFIX\lib"
          Write-Host "== .lib files in $lib =="
          Get-ChildItem "$lib\*.lib" | ForEach-Object { Write-Host $_.Name }
          function Ensure-Lib($target, $pattern) {
            if (-not (Test-Path "$lib\$target")) {
              $src = Get-ChildItem "$lib\$pattern" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($src) { Copy-Item $src.FullName "$lib\$target" }
            }
          }
          Ensure-Lib 'z.lib' '*zlib*.lib'
          Ensure-Lib 'xml2.lib' '*xml2*.lib'
          Ensure-Lib 'zstd.dll.lib' '*zstd*.lib'
          micromamba run -n llvm cargo test --features codegen
