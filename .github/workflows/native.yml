name: Native backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 all
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --features codegen

  # use vovkos/llvm-package-windows
  windows:
    name: windows-latest (best effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch prebuilt LLVM 21 (vovkos)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod "https://api.github.com/repos/vovkos/llvm-package-windows/releases/tags/llvm-21.1.1" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $asset = $rel.assets | Where-Object { $_.name -match 'windows-amd64' -and $_.name -match 'msvcrt' } | Select-Object -First 1
          if (-not $asset) { Write-Host "no matching asset; available:"; $rel.assets.name; exit 1 }
          Write-Host "Downloading $($asset.name)"
          curl.exe -L -o llvm.7z $asset.browser_download_url
          7z x llvm.7z -oC:\llvm | Out-Null
          $cfg = Get-ChildItem C:\llvm -Recurse -Filter llvm-config.exe | Select-Object -First 1
          if (-not $cfg) { Write-Host "llvm-config.exe not found under C:\llvm"; exit 1 }
          $prefix = Split-Path (Split-Path $cfg.FullName)
          Write-Host "LLVM prefix: $prefix"
          echo "LLVM_SYS_211_PREFIX=$prefix" >> $env:GITHUB_ENV
          echo "$prefix\bin" >> $env:GITHUB_PATH
      - name: Test
        shell: pwsh
        run: |
          # Git's coreutils link.exe shadows the MSVC linker; drop it from PATH.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Git\usr\bin*' }) -join ';'
          cargo test --features codegen
