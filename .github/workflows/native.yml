name: Native backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 all
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --features codegen

  # use vovkos/llvm-package-windows
  windows:
    name: windows-latest (best effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: llvm
          create-args: >-
            llvmdev=21
            clang=21
            zlib
            libxml2
            zstd
      - name: Test
        shell: pwsh
        run: |
          # Git's coreutils link.exe shadows the MSVC linker; drop it from PATH.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Git\usr\bin*' }) -join ';'
          $env:LLVM_SYS_211_PREFIX = "$env:MAMBA_ROOT_PREFIX\envs\llvm\Library"
          $lib = "$env:LLVM_SYS_211_PREFIX\lib"
          $bin = "$env:LLVM_SYS_211_PREFIX\bin"
          function Ensure-Lib($target, $libGlob, $dllGlob) {
            if (Test-Path "$lib\$target") { return }
            $src = Get-ChildItem "$lib\$libGlob" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($src) { Copy-Item $src.FullName "$lib\$target"; return }
            $dll = Get-ChildItem "$bin\$dllGlob" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $dll) { Write-Host "WARN: no lib or dll for $target"; return }
            $def = Join-Path $lib (($target -replace '\.lib$','') + '.def')
            "LIBRARY $($dll.Name)`nEXPORTS" | Set-Content -Encoding ascii $def
            (& dumpbin /nologo /exports $dll.FullName) |
              Select-String '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } |
              Add-Content -Encoding ascii $def
            & lib /nologo "/def:$def" "/out:$lib\$target" /machine:x64 | Out-Null
            Write-Host "synthesized $target from $($dll.Name)"
          }
          Ensure-Lib 'z.lib' '*zlib*.lib' '*zlib*.dll'
          Ensure-Lib 'xml2.lib' '*xml2*.lib' '*xml2*.dll'
          Ensure-Lib 'zstd.dll.lib' '*zstd*.lib' '*zstd*.dll'
          micromamba run -n llvm cargo test --features codegen
