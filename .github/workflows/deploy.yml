name: Deploy docs and playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build wasm compiler
        run: wasm-pack build --target web --out-name compiler -- --no-default-features

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build docs
        working-directory: docs
        run: |
          npm install
          npm run build

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r docs/dist/. _site/
          mkdir -p _site/play/pkg _site/play/runtime
          cp index.html logo.svg favicon.svg _site/play/
          cp -r playground _site/play/
          cp -r res _site/play/
          cp runtime/kora_browser_runtime.js _site/play/runtime/
          cp pkg/compiler.js pkg/compiler_bg.wasm _site/play/pkg/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
