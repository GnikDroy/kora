name: Deploy playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build wasm
        run: wasm-pack build --target web --out-name compiler

      - name: Assemble site
        run: |
          mkdir -p _site/pkg
          cp index.html _site/
          cp logo.svg favicon.svg _site/
          cp -r playground _site/
          cp -r res _site/
          cp pkg/compiler.js pkg/compiler_bg.wasm _site/pkg/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
